<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Doctor Appointment</h1>
            <p>Book your appointment with our specialists</p>
        </div>

        <form id="appointmentForm">

            <h2>Patient Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number">
                    <small id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                    <small id="dobError"></small>
                </div>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>
            </div>

            <h2>Appointment Details</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Select Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Dentist">Dentist</option>
                    </select>

                    <small id="departmentError"></small>
                </div>

                <div class="form-group">
                    <label>Select Doctor</label>

                    <select id="doctor">
                        <option value="">Select Doctor</option>
                        <option value="Dr. Sharma">Dr. Sharma</option>
                        <option value="Dr. Priya">Dr. Priya</option>
                        <option value="Dr. Raj">Dr. Raj</option>
                        <option value="Dr. Anjali">Dr. Anjali</option>
                    </select>

                    <small id="doctorError"></small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Appointment Date</label>
                    <input type="date" id="appointmentDate">
                    <small id="dateError"></small>
                </div>

                <div class="form-group">
                    <label>Appointment Time</label>
                    <select id="time">
                        <option value="">Select Time</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                        <option value="03:00 PM">03:00 PM</option>
                        <option value="04:00 PM">04:00 PM</option>
                    </select>

                    <small id="timeError"></small>
                </div>
            </div>

            <div class="form-group">
                <label>Reason for Visit</label>
                <textarea id="message" rows="4"
                    placeholder="Describe your problem..."></textarea>
            </div>

            <button type="submit">Book Appointment</button>

        </form>

        <div id="successMessage" class="success">
            <h2>Appointment Booked Successfully!</h2>
            <p id="appointmentInfo"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
